name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          # Copier le build client vers le VPS
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            client/dist/ \
            root@${{ secrets.VPS_HOST }}:/opt/echoras/client/dist/

          # Sur le VPS : pull serveur + restart
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} "
            set -e
            cd /opt/echoras
            git fetch origin
            git reset --hard origin/main
            chown -R www-data:www-data /opt/echoras/client/dist
            systemctl restart echoras
            sleep 3
            journalctl -u echoras -n 8 --no-pager
          "
